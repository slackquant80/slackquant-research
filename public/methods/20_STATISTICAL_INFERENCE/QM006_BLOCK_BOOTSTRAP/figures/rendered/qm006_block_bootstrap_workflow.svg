<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="340" viewBox="0 0 1120 340"><rect width="1120" height="340" fill="#fbfaf7"/><style>.t{font:19px Arial,sans-serif;fill:#202428}.s{font:15px Arial,sans-serif;fill:#53616b}.b{fill:#f5f3ed;stroke:#8da0ad;stroke-width:1.6}.a{stroke:#6f8998;stroke-width:2.5;fill:none}.k{font:bold 14px Arial,sans-serif;fill:#53616b}</style><text class="k" x="545" y="24" text-anchor="middle">two alternative resampling designs</text><rect class="b" x="40" y="115" rx="8" width="230" height="110"/><text class="t" x="155" y="157" text-anchor="middle">Dependent series</text><text class="s" x="155" y="190" text-anchor="middle">local order carries information</text><path class="a" d="M270 155 H330 V90 H375"/><path fill="#6f8998" d="M375 90 l-12 -7 v14 z"/><path class="a" d="M270 185 H330 V250 H375"/><path fill="#6f8998" d="M375 250 l-12 -7 v14 z"/><rect class="b" x="375" y="35" rx="8" width="270" height="110"/><text class="t" x="510" y="76" text-anchor="middle">IID bootstrap</text><text class="s" x="510" y="108" text-anchor="middle">sample individual observations</text><text class="s" x="510" y="132" text-anchor="middle">serial order is largely lost</text><rect class="b" x="375" y="195" rx="8" width="270" height="110"/><text class="t" x="510" y="236" text-anchor="middle">Moving-block bootstrap</text><text class="s" x="510" y="268" text-anchor="middle">sample consecutive blocks</text><text class="s" x="510" y="292" text-anchor="middle">local order is retained within blocks</text><path class="a" d="M645 90 H705 V155 H770"/><path fill="#6f8998" d="M770 155 l-12 -7 v14 z"/><path class="a" d="M645 250 H705 V185 H770"/><path fill="#6f8998" d="M770 185 l-12 -7 v14 z"/><rect class="b" x="770" y="115" rx="8" width="260" height="110"/><text class="t" x="900" y="157" text-anchor="middle">Bootstrap uncertainty</text><text class="s" x="900" y="190" text-anchor="middle">SE, interval, or test statistic</text></svg>