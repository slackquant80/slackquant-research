/* v0.20.12 Strategy Supply PM-facing layout hardening */
/* v0.20.13 numeric-table alignment contract: numeric columns centered dashboard-wide */
.supply-kpis .kpi{min-height:104px;overflow:hidden}
.supply-kpis .kpi .k{overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .v.textual{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.16;overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .note{line-height:1.28;overflow-wrap:anywhere;word-break:normal}
.supply-kpis .search-state-kpi .v.textual{font-size:13.5px;letter-spacing:.01em}
.status-row>*{min-width:0}
.supply-evidence-grid{grid-template-columns:1fr}
.supply-evidence-grid>.panel{min-width:0}

@media(max-width:820px){.supply-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.supply-kpis{grid-template-columns:1fr}}

/* Dashboard table alignment contract: identifiers/text left; numeric data centered. */

/* v0.20.14 Core overview comparison-table readability hardening */
.grid.core-perf-split{grid-template-columns:minmax(0,1.15fr) minmax(680px,.95fr)}
.core-compare-wrap{overflow-x:auto}
.core-compare-table{min-width:660px;font-size:10px}
.core-compare-table th,.core-compare-table td{padding-left:7px;padding-right:7px}
.core-compare-table th:first-child,.core-compare-table td:first-child{min-width:145px}
.core-compare-table th.num,.core-compare-table td.num{min-width:70px;white-space:nowrap}
.core-compare-table .series-cell{vertical-align:middle;white-space:nowrap;line-height:1.18}
.core-compare-table .series-sub{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:500;white-space:nowrap}
@media(max-width:1420px){.grid.core-perf-split{grid-template-columns:1fr}.core-compare-table{min-width:0}}


.provider-scope-note{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);line-height:1.45}

/* v0.20.20 Core Portfolio Performance PM monitor */
.core-performance-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid.core-performance-chart-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}

.perf-wide-table{min-width:840px}
.annual-return-table{min-width:690px}
.monthly-return-table{min-width:1040px}
.period-label{white-space:nowrap;vertical-align:middle}
.perf-return{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}

@media(max-width:520px){.core-performance-kpis{grid-template-columns:1fr}}

.core-performance-head{align-items:flex-end}
.core-performance-controls{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.core-performance-note{line-height:1.45}

.core-performance-table-grid .series-cell{vertical-align:middle;line-height:1.18;min-width:168px}
.core-performance-table-grid .series-cell b{display:block;white-space:nowrap}
.core-performance-table-grid .series-sub{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:500;white-space:normal;line-height:1.2}
.core-performance-table-grid .core-perf-primary-row td{background:rgba(59,130,246,.028)}
.core-performance-table-grid .core-perf-primary-row .series-cell{box-shadow:inset 3px 0 0 #3b82f6}

.core-performance-table-grid>section:last-child .tbl td:first-child{min-width:154px}

@media(max-width:820px){.core-performance-head{align-items:flex-start}.core-performance-controls{justify-content:flex-start}}

script>
(()=>{'use strict';
const D=window.PDS_PUBLIC_DATA,app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n=x=>{if(x===null||x===undefined||String(x).trim()==='')return null;const v=Number(x);return Number.isFinite(v)?v:null};
const pct=(x,d=1)=>n(x)===null?'—':`${(n(x)*100).toFixed(d)}%`,num=(x,d=2)=>n(x)===null?'—':n(x).toFixed(d),multi=(x,d=2)=>n(x)===null?'—':`${n(x).toFixed(d)}×`;
const signed=(x,d=1)=>n(x)===null?'—':`${n(x)>=0?'+':''}${(n(x)*100).toFixed(d)}%`;

const byMonth=(a,b)=>String(a.holding_month||a.period||'').localeCompare(String(b.holding_month||b.period||''));
function badge(text,kind='soft'){return `<span class="pill ${kind}">${esc(text)}</span>`}
function pagehead(title,copy,tag='DELAYED PUBLIC',kind='accent'){return `<div class="pagehead"><div><div class="eyebrow">PDS · PUBLIC OPERATING EVIDENCE</div><h2>${esc(title)}</h2><p>${esc(copy)}</p></div>${badge(tag,kind)}</div>`}
function releaseBand(){return `<div class="notice info global-time-notice"><strong>Governed delayed profile.</strong> Public evidence is released through completed holding <b>${esc(holding)}</b>. Current asset targets, Forward Preview, Forward Shadow, current mark, and current FX state remain private.</div><div class="global-data-clock official-only"><div><span>Public snapshot</span><b>${esc(publicAsOf||'—')}</b></div><div><span>Latest released signal</span><b>${esc(latest||'—')}</b></div><div><span>Completed holding</span><b>${esc(holding||'—')}</b></div><div><span>Core definition</span><b>F2R 25% · ADAA 75%</b></div></div>`}
function pathRows(source,id){return source.filter(r=>r.series_id===id).slice().sort(byMonth)}
function wealthStats(source,id){const rows=pathRows(source,id);if(!rows.length)return{};return {last:rows.at(-1),rows}}
function trailing(source,id,months){const a=pathRows(source,id);if(a.length<months)return null;return a.slice(-months).reduce((w,r)=>w*(1+n(r.net_return)),1)-1}
function ytd(source,id){const a=pathRows(source,id),last=a.at(-1)?.holding_month||'';if(!last)return null;const y=last.slice(0,4),r=a.filter(x=>String(x.holding_month).startsWith(y));return r.reduce((w,x)=>w*(1+n(x.net_return)),1)-1}
function chart(source,ids,field='cumulative_wealth',kind='wealth'){
 const series=ids.map(id=>({id,rows:pathRows(source,id).filter(r=>n(r[field])!==null)})).filter(s=>s.rows.length);if(!series.length)return'<div class="empty">No released history.</div>';
 const months=[...new Set(series.flatMap(s=>s.rows.map(r=>r.holding_month)))].sort(),ix=new Map(months.map((m,i)=>[m,i]));let vals=series.flatMap(s=>s.rows.map(r=>n(r[field])));let lo=Math.min(...vals),hi=Math.max(...vals);if(kind==='drawdown'){hi=0;lo=Math.min(lo,0)}if(hi<=lo){hi=lo+1}const W=1000,H=260,L=52,R=20,T=16,B=30,x=m=>L+(months.length<=1?.5:(ix.get(m)||0)/(months.length-1))*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);let svg=`<svg class="public-chart-svg" viewBox="0 0 ${W} ${H}" role="img">`;
 for(let g=0;g<5;g++){const v=hi-(hi-lo)*g/4,yy=y(v);svg+=`<line class="public-chart-grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="public-axis-label" x="${L-7}" y="${yy+3}" text-anchor="end">${kind==='drawdown'?pct(v,0):num(v,2)}</text>`}if(kind==='drawdown'&&lo<0){svg+=`<line class="public-chart-zero" x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}"/>`}
 series.forEach(s=>{const pts=s.rows.map((r,i)=>`${i?'L':'M'}${x(r.holding_month).toFixed(1)},${y(n(r[field])).toFixed(1)}`).join(' ');svg+=`<path class="public-chart-line" stroke="${COLORS[s.id]||'#2563eb'}" d="${pts}"/>`});
 const ticks=[0,.25,.5,.75,1].map(q=>Math.round(q*(months.length-1))).filter((v,i,a)=>a.indexOf(v)===i);ticks.forEach((j,i)=>{const m=months[j],anchor=i===0?'start':i===ticks.length-1?'end':'middle';svg+=`<text class="public-axis-label" x="${x(m)}" y="${H-7}" text-anchor="${anchor}">${esc(m)}</text>`});svg+='</svg>';return svg+`<div class="public-legend">${ids.map(id=>`<span><i style="background:${COLORS[id]||'#2563eb'}"></i>${esc(LABELS[id]||id)}</span>`).join('')}</div>`;
}

<div class="grid cols2 section"><section class="panel"><div class="panel-title"><div><h3>ADAA</h3><p>Portfolio Strategy System · Decision Diversification</p></div><span class="public-profile-tag">PROVIDER</span></div><p class="muted">Independent multi-asset strategy provider. Its internal strategy logic and evidence lineage remain ADAA-owned.</p><a class="public-provider-link" href="/systems/adaa/" target="_top">View ADAA →</a></section><section class="panel"><div class="panel-title"><div><h3>Forecast-to-Rank Allocation (F2R)</h3><p>Machine-Learning Cross-Asset Portfolio Strategy</p></div><span class="public-profile-tag">PROVIDER</span></div><p class="muted">Independent forecast-ranked strategy provider. PDS consumes governed target outputs without recreating provider science.</p><a class="public-provider-link" href="/systems/f2r/" target="_top">View F2R →</a></section></div><div class="notice info section"><strong>Why the delay exists.</strong> Historical operating decisions and performance can be inspected without turning the public site into a live portfolio-instruction feed.</div>`}
function shell(content){const nav=`<div class="nav-section">Public dashboard</div><div class="public-nav-note">Completed evidence · current decision state protected</div>${NAV.map(([k,ic,t])=>`<button data-page="${k}" class="${page===k?'active':''}"><span class="nav-icon">${ic}</span>${t}</button>`).join('')}`;return `<div class="app-shell"><aside class="sidebar"><div class="brand-lockup"><div class="brand-mark"></div><div><div class="brand-name">SlackQuant</div><div class="brand-sub">Systems</div></div></div><div class="side-nav">${nav}</div><div class="side-bottom"><b>RS-03 · Portfolio Decision System</b>Governed delayed public profile.<br>Current decision-sensitive state stays private.<br><br><a href="/systems/pds/" target="_top">← PDS system page</a></div></aside><div class="main"><header class="topbar"><div class="product-title"><div class="pds-product-kicker">SlackQuant Systems · RS-03</div><h1>Portfolio Decision System</h1></div><div class="modebox">${badge('DELAYED PUBLIC','accent')}${badge(`Through ${holding}`,'dark')}</div></header><main class="wrap">${content}<div class="footer"><span><b>SlackQuant Systems</b> · Portfolio Decision System · Public Read Model</span><span>Completed / delayed evidence only · current decision-sensitive state protected.</span></div></main></div></div>`}
function render(){const f={overview,performance,portfolio,investor,system};app.innerHTML=shell(f[page]());app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)})}render();})();
</script></body></html>
