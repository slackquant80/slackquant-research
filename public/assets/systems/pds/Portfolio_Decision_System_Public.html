/* v0.20.12 Strategy Supply PM-facing layout hardening */
/* v0.20.13 numeric-table alignment contract: numeric columns centered dashboard-wide */
.supply-kpis .kpi{min-height:104px;overflow:hidden}
.supply-kpis .kpi .k{overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .v.textual{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.16;overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .note{line-height:1.28;overflow-wrap:anywhere;word-break:normal}
.supply-kpis .search-state-kpi .v.textual{font-size:13.5px;letter-spacing:.01em}
.status-row>*{min-width:0}
.supply-evidence-grid{grid-template-columns:1fr}
.supply-evidence-grid>.panel{min-width:0}

@media(max-width:1460px){.supply-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.supply-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.supply-kpis{grid-template-columns:1fr}}

/* Dashboard table alignment contract: identifiers/text left; numeric data centered. */
.tbl th.num,.tbl td.num{text-align:center}
.tbl td.num{vertical-align:middle}
/* v0.20.14 Core overview comparison-table readability hardening */
.grid.core-perf-split{grid-template-columns:minmax(0,1.15fr) minmax(680px,.95fr)}
.core-compare-wrap{overflow-x:auto}
.core-compare-table{min-width:660px;font-size:10px}
.core-compare-table th,.core-compare-table td{padding-left:7px;padding-right:7px}
.core-compare-table th:first-child,.core-compare-table td:first-child{min-width:145px}
.core-compare-table th.num,.core-compare-table td.num{min-width:70px;white-space:nowrap}
.core-compare-table .series-cell{vertical-align:middle;white-space:nowrap;line-height:1.18}
.core-compare-table .series-sub{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:500;white-space:nowrap}
@media(max-width:1420px){.grid.core-perf-split{grid-template-columns:1fr}.core-compare-table{min-width:0}}


.provider-scope-note{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);line-height:1.45}

/* v0.20.20 Core Portfolio Performance PM monitor */
.core-performance-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid.core-performance-chart-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}

.perf-wide-wrap,.annual-return-wrap,.monthly-return-wrap{overflow-x:auto}
.perf-wide-table{min-width:840px}
.annual-return-table{min-width:690px}
.monthly-return-table{min-width:1040px}
.period-label{white-space:nowrap;vertical-align:middle}
.perf-return{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}
.perf-return.perf-pos{background:rgba(22,163,74,.055);color:#167347}
.perf-return.perf-neg{background:rgba(220,38,38,.045);color:#a23a3a}

.monthly-return-table th.num,.monthly-return-table td.num{min-width:58px}

.annual-return-table th.num,.annual-return-table td.num{min-width:90px}
@media(max-width:1420px){.grid.core-performance-chart-grid,.grid.core-performance-table-grid{grid-template-columns:1fr}}
@media(max-width:1180px){.core-performance-kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.core-performance-kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.core-performance-kpis{grid-template-columns:1fr}}

/* RS-03 v0.20.31 · compact fixed-Core performance basis */
.core-performance-note{line-height:1.35}
.core-performance-support{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfe;color:var(--muted);font-size:9.5px;line-height:1.3}

.core-performance-support b{color:var(--text);font-size:10px;font-variant-numeric:tabular-nums}
.core-performance-support em{font-style:normal;color:var(--muted)}


/* v0.20.22 Core Performance product/UX polish */
.core-performance-head{align-items:flex-end}
.core-performance-controls{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.core-performance-note{line-height:1.45}
.core-performance-note span{color:var(--muted)}
.core-performance-table-grid .series-cell{vertical-align:middle;line-height:1.18;min-width:168px}
.core-performance-table-grid .series-cell b{display:block;white-space:nowrap}
.core-performance-table-grid .series-sub{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:500;white-space:normal;line-height:1.2}
.core-performance-table-grid .core-perf-primary-row td{background:rgba(59,130,246,.028)}
.core-performance-table-grid .core-perf-primary-row .series-cell{box-shadow:inset 3px 0 0 #3b82f6}
.perf-wide-table{min-width:840px;font-size:10px}
.perf-wide-table th,.perf-wide-table td{padding-left:6px;padding-right:6px}
.perf-wide-table th:first-child,.perf-wide-table td:first-child{min-width:180px}

.core-performance-table-grid>section:last-child .tbl td:first-child{min-width:154px}
.annual-return-table th:first-child,.annual-return-table td:first-child,
.monthly-return-table th:first-child,.monthly-return-table td:first-child{position:sticky;left:0;z-index:1;background:#fff}

.annual-return-table tbody tr:hover td:first-child,.monthly-return-table tbody tr:hover td:first-child{background:#fbfdff}
@media(max-width:820px){.core-performance-head{align-items:flex-start}.core-performance-controls{justify-content:flex-start}}

/* RS-03 v0.20.24 · current provisional mark + ADAA_H reconciliation */
.current-mark-panel{margin-top:12px;border-color:#ead6a7;background:linear-gradient(180deg,#fffdfa 0%,#fff 100%)}

@media(max-width:700px){.current-mark-grid{grid-template-columns:repeat(2,1fr)}}

/* RS-03 v0.20.27 · PM Cockpit Level 1 */

.cockpit-hero{padding:18px 20px;background:linear-gradient(135deg,#fbfcff 0%,#fff 62%);border-color:#ccd9ee}

function lineSvg(series,ids){const W=1000,H=260,p=28;let all=[];ids.forEach(id=>all.push(...series.filter(r=>r.series_id===id).map(r=>n(r.cumulative_wealth)).filter(v=>v!==null)));if(!all.length)return'<div class="notice info">No released history.</div>';const lo=Math.min(...all),hi=Math.max(...all),rng=Math.max(1e-9,hi-lo);const names={PDS_ACTIVE_CORE:'PDS Core',ADAA:'ADAA',F2R:'F2R',SPY_AGG_60_40:'60/40',DYNAMIC_COSTED:'Dynamic FX',FIXED50_COSTED:'Fixed 50',UNHEDGED_KRW:'Unhedged',CORE_USD:'Core USD'};const cls={ADAA:' adaa',F2R:' f2r',SPY_AGG_60_40:' secondary',DYNAMIC_COSTED:' fx',FIXED50_COSTED:' secondary',UNHEDGED_KRW:' adaa',CORE_USD:' f2r'};let svg=`<svg class="public-chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;for(let g=0;g<4;g++){const y=p+(H-2*p)*g/3;svg+=`<line class="public-chart-grid" x1="${p}" y1="${y}" x2="${W-p}" y2="${y}"/>`;}ids.forEach(id=>{const a=series.filter(r=>r.series_id===id).sort((x,y)=>x.holding_month.localeCompare(y.holding_month));if(!a.length)return;const pts=a.map((r,i)=>`${p+(W-2*p)*(a.length===1?.5:i/(a.length-1))},${p+(H-2*p)*(1-(n(r.cumulative_wealth)-lo)/rng)}`).join(' ');svg+=`<polyline class="public-chart-line${cls[id]||''}" points="${pts}"/>`;});svg+='</svg>';svg+=`<div class="legend">${ids.map(id=>`<span>${esc(names[id]||id)}</span>`).join('')}</div>`;return svg;}

function overview(){const s=summary('PDS_ACTIVE_CORE'),w=D.weights.find(r=>r.signal_period===latest)||{},aa=rows(D.assets,'signal_period',latest).sort((a,b)=>n(b.aggregate_weight)-n(a.aggregate_weight)).slice(0,8);return `${pagehead('PDS · Public operating view','PM Cockpit','Released portfolio state and completed-holding performance.')}<div class="notice info"><strong>Public release boundary.</strong> The dashboard uses the same PDS presentation language as the operator system, but only completed historical states are materialized here. The current asset-level target, Forward Preview, Forward Shadow, current mark, and current FX state are not exported.</div><div class="kpis"><div class="kpi accented"><div class="k">Released signal</div><div class="v textual">${esc(latest)}</div><div class="note">holding ${esc(holding)}</div></div><div class="kpi"><div class="k">Core allocation</div><div class="v textual">25 / 75</div><div class="note">F2R / ADAA · fixed</div></div><div class="kpi"><div class="k">CAGR</div><div class="v">${pct(s.cagr)}</div><div class="note">daily risk clock</div></div><div class="kpi"><div class="k">Sharpe · RF=0</div><div class="v">${num(s.sharpe_rf0)}</div><div class="note">daily</div></div><div class="kpi"><div class="k">Max drawdown</div><div class="v">${pct(s.max_drawdown)}</div><div class="note">daily path</div></div><div class="kpi"><div class="k">Calmar</div><div class="v">${num(s.calmar)}</div><div class="note">CAGR / |MDD|</div></div></div><section class="panel"><div class="panel-title"><div><h3>Latest released portfolio</h3><p>Signal ${esc(latest)} · holding ${esc(holding)}</p></div><span class="pill good">100% RELEASED</span></div><div class="public-holdings-grid">${aa.map(r=>`<div class="public-holding"><span>${esc(r.asset_id)}</span><b>${pct(r.aggregate_weight)}</b><em>target weight</em></div>`).join('')}</div></section><section class="chart section"><h3>Core wealth path</h3><p>Completed holding months</p>${lineSvg(D.corePath,['PDS_AC function locked(kind){return `${pagehead('PDS · Monitoring boundary',kind,kind+' remains a private operating monitor until its state becomes historical and release-eligible.','PRIVATE CURRENT STATE')}<section class="panel public-lock"><div class="public-lock-inner"><div class="public-lock-icon">◇</div><h3>${esc(kind)} is not published live</h3><p class="muted">The public dashboard intentionally contains no current ${esc(kind)} values. This preserves the operator/public disclosure boundary without maintaining a separate visual product.</p><div class="notice info tight">Released performance and portfolio history remain available in the other pages.</div></div></section>`}
function fx(){const a=D.fxHedge.slice().sort((x,y)=>y.holding_month.localeCompare(x.holding_month));return `${pagehead('PDS · FX sensitivity','FX Overlay','Delayed historical hedge-state sensitivity; current FX state is not exported.')}<div class="kpis"><div class="kpi accented"><div class="k">Latest released holding</div><div class="v textual">${esc(a[0]?.holding_month||'—')}</div><div class="note">historical</div></div><div class="kpi"><div class="k">Dynamic hedge</div><div class="v">${pct(a[0]?.dynamic_hedge_ratio,0)}</div><div class="note">released state</div></div><div class="kpi"><div class="k">Z-score</div><div class="v">${num(a[0]?.zscore_signal)}</div><div class="note">released signal</div></div></div><section class="panel"><div class="panel-title"><div><h3>Released hedge-state history</h3><p>Most recent 36 completed holding months</p></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Signal</th><th>Holding</th><th>Z-score</th><th>Hedge ratio</th></tr></thead><tbody>${a.slice(0,36).map(r=>`<tr><td>${esc(r.signal_period)}</td><td>${esc(r.holding_month)}</td><td class="num">${num(r.zscore_signal)}</td><td class="num">${pct(r.dynamic_hedge_ratio,0)}</td></tr>`).join('')}</tbody></table></div></section>`}
function fxperf(){const ids=['CORE_USD','UNHEDGED_KRW','FIXED50_COSTED','DYNAMIC_COSTED'];return `${pagehead('PDS · FX sensitivity','FX Performance','Completed historical USD/KRW spot-sensitivity paths. Current FX state remains private.')}<div class="kpis">${ids.map(id=>{const s=fxsum(id);return `<div class="kpi${id==='DYNAMIC_COSTED'?' accented':''}"><div class="k">${esc(s.display_name||id)}</div><div class="v">${pct(s.cagr)}</div><div class="note">CAGR</div></div>`}).join('')}</div><section class="chart"><h3>FX sensitivity wealth paths</h3><p>Delayed completed history</p>${lineSvg(D.fxPath,ids)}</section><section class="panel section"><div class="panel-title"><div><h3>Risk / return comparison</h3><p>Daily risk metrics through the public cutoff</p></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Series</th><th>CAGR</th><th>Vol</th><th>Sharpe</th><th>MDD</th><th>Calmar</th><th>Terminal</th></tr></thead><tbody>${ids.map(id=>{const s=fxsum(id);return `<tr><td><b>${esc(s.display_name||id)}</b></td><td class="num">${pct(s.cagr)}</td><td class="num">${pct(s.ann_vol)}</td><td class="num">${num(s.sharpe_rf0)}</td><td class="num">${pct(s.max_drawdown)}</td><td class="num">${num(s.calmar)}</td><td class="num">${num(s.terminal_wealth)}×</td></tr>`}).join('')}</tbody></table></div></section>`}
function render(){const f={overview,core,weights,shadow:()=>locked('Forward Shadow'),preview:()=>locked('Forward Preview'),fx,fxperf};app.innerHTML=`<div class="app-shell"><aside class="sidebar"><div class="brand-lockup"><div class="brand-mark"></div><div><div class="brand-name">PDS</div><div class="brand-sub">Portfolio Decision System</div></div></div><nav class="side-nav">${nav.map(([id,ic,l])=>`<button data-page="${id}" class="${id===current?'active':''}"><span class="nav-icon">${ic}</span>${esc(l)}</button>`).join('')}</nav><div class="side-bottom"><b>SlackQuant · Portfolio Decision System</b><span>Delayed public operating view</span><a class="public-boundary-link" href="/systems/pds/" target="_top">← System page</a></div></aside><main class="main"><header class="topbar"><div class="product-title"><h1>Portfolio Decision System</h1><span class="crumb">Public Dashboard</span></div><div class="modebox"><span class="pill accent">DELAYED PUBLIC</span><span class="pill dark">through ${esc(holding)}</span></div></header><div class="wrap">${f[current]()}</div></main></div>`;app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render();window.scrollTo(0,0)})}render();})();
</script></body></html>
