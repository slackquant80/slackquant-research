/* v0.20.12 Strategy Supply PM-facing layout hardening */
/* v0.20.13 numeric-table alignment contract: numeric columns centered dashboard-wide */
.supply-kpis .kpi{min-height:104px;overflow:hidden}
.supply-kpis .kpi .k{overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .v.textual{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.16;overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .note{line-height:1.28;overflow-wrap:anywhere;word-break:normal}

.status-row>*{min-width:0}
.supply-evidence-grid{grid-template-columns:1fr}
.supply-evidence-grid>.panel{min-width:0}

.core-compare-table th.num,.core-compare-table td.num{min-width:70px;white-space:nowrap}
.core-compare-table .series-cell{vertical-align:middle;white-space:nowrap;line-height:1.18}
.core-compare-table .series-sub{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:500;white-space:nowrap}
@media(max-width:1420px){.grid.core-perf-split{grid-template-columns:1fr}.core-compare-table{min-width:0}}


.provider-scope-note{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);line-height:1.45}

.core-performance-table-grid .series-cell b{display:block;white-space:nowrap}
.core-performance-table-grid .series-sub{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:500;white-space:normal;line-height:1.2}
.core-performance-table-grid .core-perf-primary-row td{background:rgba(59,130,246,.028)}

function weights(){const ws=D.weights.filter(r=>r.signal_period<=latest).sort((a,b)=>b.signal_period.localeCompare(a.signal_period)),aa=rows(D.assets,'signal_period',latest).sort((a,b)=>n(b.aggregate_weight)-n(a.aggregate_weight));return `${pagehead('Portfolio Weights','Released historical provider and look-through target weights')}${releaseContext()}<div class="policy-state-strip"><div class="policy-state-card current"><div><span>PDS Core</span><b>F2R 25% · ADAA 75%</b><small>Canonical fixed Core · entire displayed history</small></div>${badge('CANONICAL','good')}</div></div><section class="panel section"><div class="panel-title"><div><h3>Latest released asset targets</h3><p>Signal ${esc(latest)} · completed holding ${esc(holding)}</p></div>${badge('HISTORICAL RELEASE','accent')}</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Asset</th><th class="num">Weight</th></tr></thead><tbody>${aa.map(r=>`<tr><td><b>${esc(r.asset_id)}</b></td><td class="num">${pct(r.aggregate_weight,2)}</td></tr>`).join('')}</tbody></table></div></section><section class="panel section"><div class="panel-title"><div><h3>Provider-weight history</h3><p>Canonical Core definition</p></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Signal</th><th>Holding</th><th class="num">F2R</th><th class="num">ADAA</th></tr></thead><tbody>${ws.slice(0,36).map(r=>`<tr><td>${esc(r.signal_period)}</td><td>${esc(r.holding_month)}</td><td class="num">${pct(r.f2r_weight)}</td><td class="num">${pct(r.adaa_weight)}</td></tr>`).join('')}</tbody></table></div></section>`}
function locked(kind,copy){return `${pagehead(kind,copy,'PRIVATE CURRENT STATE','warn')}${releaseContext()}<section class="panel public-lock"><div class="public-lock-inner"><div class="public-lock-icon">◇</div><h3>${esc(kind)} is not published live</h3><p class="muted">The current ${esc(kind)} values are intentionally absent from this public artifact. This is the same PDS presentation family with a governed disclosure profile, not a second decision system.</p><div class="notice info tight">Completed portfolio and performance history remain available on the public pages.</div></div></section>`}
function fx(){const a=D.fxHedge.slice().sort((x,y)=>y.holding_month.localeCompare(x.holding_month));return `${pagehead('FX Overlay','Delayed historical hedge-state sensitivity · current FX state protected')}${releaseContext()}<div class="kpis"><div class="kpi accented"><div class="k">Latest released holding</div><div class="v textual">${esc(a[0]?.holding_month||'—')}</div><div class="note">historical</div></div><div class="kpi"><div class="k">Dynamic hedge</div><div class="v">${pct(a[0]?.dynamic_hedge_ratio,0)}</div><div class="note">released state</div></div><div class="kpi"><div class="k">Z-score</div><div class="v">${num(a[0]?.zscore_signal)}</div><div class="note">released signal</div></div></div><section class="panel"><div class="panel-title"><div><h3>Released hedge-state history</h3><p>Most recent completed holding months</p></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Signal</th><th>Holding</th><th class="num">Z-score</th><th class="num">Hedge ratio</th></tr></thead><tbody>${a.slice(0,36).map(r=>`<tr><td>${esc(r.signal_period)}</td><td>${esc(r.holding_month)}</td><td class="num">${num(r.zscore_signal)}</td><td class="num">${pct(r.dynamic_hedge_ratio,0)}</td></tr>`).join('')}</tbody></table></div></section>`}
function fxperf(){const ids=['CORE_USD','UNHEDGED_KRW','FIXED50_COSTED','DYNAMIC_COSTED'];return `${pagehead('FX Performance','Completed historical USD/KRW spot-sensitivity paths · current FX state protected')}${releaseContext()}<div class="kpis">${ids.map(id=>{const s=fxsum(id);return `<div class="kpi${id==='DYNAMIC_COSTED'?' accented':''}"><div class="k">${esc(s.display_name||id)}</div><div class="v">${pct(s.cagr)}</div><div class="note">CAGR</div></div>`}).join('')}</div><section class="chart"><h3>FX sensitivity wealth paths</h3><p>Delayed completed history</p>${lineSvg(D.fxPath,ids)}</section><section class="panel section fx-risk-wrap"><div class="panel-title"><div><h3>Risk / return comparison</h3><p>Governed delayed support</p></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Series</th><th>CAGR</th><th>Vol</th><th>Sharpe</th><th>MDD</th><th>Calmar</th><th>Terminal</th></tr></thead><tbody>${ids.map(id=>{const s=fxsum(id);return `<tr><td><b>${esc(s.display_name||id)}</b></td><td class="num">${pct(s.cagr)}</td><td class="num">${pct(s.ann_vol)}</td><td class="num">${num(s.sharpe_rf0)}</td><td class="num">${pct(s.max_drawdown)}</td><td class="num">${num(s.calmar)}</td><td class="num">${num(s.terminal_wealth)}×</td></tr>`}).join('')}</tbody></table></div></section>`}
function shell(content){const navHtml=`<div class="nav-section">PM workspace</div>${nav.map(([k,ic,t])=>`<button data-page="${k}" class="${current===k?'active':''}"><span class="nav-icon">${ic}</span>${t}</button>`).join('')}`;const mode=current==='overview'?'':`<div class="modebox">${badge('DELAYED PUBLIC','accent')}${badge(`Released through ${holding}`,'dark')}${badge('F2R 25% · ADAA 75%','provider')}</div>`;return `<div class="app-shell"><aside class="sidebar"><div class="brand-lockup"><div class="brand-mark"></div><div><div class="brand-name">SlackQuant</div><div class="brand-sub">Systems</div></div></div><div class="side-nav">${navHtml}</div><div class="side-bottom"><b>RS-03 · Portfolio Decision System</b>Delayed public operating view.<br>Current decision-sensitive state remains private.<br><a class="public-boundary-link" href="/systems/pds/" target="_top">← System page</a></div></aside><div class="main"><header class="topbar"><div class="product-title"><div class="pds-product-kicker">SlackQuant Systems · RS-03</div><h1>Portfolio Decision System</h1></div>${mode}</header><main class="wrap">${current==='overview'?'':releaseContext()}${content}<div class="footer${current==='overview'?' pm-footer':''}"><span><b>SlackQuant Systems</b> · Portfolio Decision System · RS-03 · Public Read Model</span>${current==='overview'?'':`<span>Completed historical evidence only · current decision-sensitive state protected.</span>`}</div></main></div></div>`}
function render(){const f={overview:cockpit,core,weights,shadow:()=>locked('Forward Shadow','Registered monitoring state remains private until release-eligible.'),preview:()=>locked('Forward Preview','Prospective target remains private and non-authoritative.'),fx,fxperf};app.innerHTML=shell(f[current]());app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render();window.scrollTo(0,0)})}render();})();
</script></body></html>
