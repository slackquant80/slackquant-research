/* v0.20.12 Strategy Supply PM-facing layout hardening */
/* v0.20.13 numeric-table alignment contract: numeric columns centered dashboard-wide */
.supply-kpis .kpi{min-height:104px;overflow:hidden}
.supply-kpis .kpi .k{overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .v.textual{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.16;overflow-wrap:anywhere;word-break:normal}
.supply-kpis .kpi .note{line-height:1.28;overflow-wrap:anywhere;word-break:normal}
.supply-kpis .search-state-kpi .v.textual{font-size:13.5px;letter-spacing:.01em}
.status-row>*{min-width:0}
.supply-evidence-grid{grid-template-columns:1fr}
.supply-evidence-grid>.panel{min-width:0}

@media(max-width:820px){.supply-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.supply-kpis{grid-template-columns:1fr}}

/* Dashboard table alignment contract: identifiers/text left; numeric data centered. */

/* v0.20.14 Core overview comparison-table readability hardening */
.grid.core-perf-split{grid-template-columns:minmax(0,1.15fr) minmax(680px,.95fr)}
.core-compare-wrap{overflow-x:auto}
.core-compare-table{min-width:660px;font-size:10px}
.core-compare-table th,.core-compare-table td{padding-left:7px;padding-right:7px}
.core-compare-table th:first-child,.core-compare-table td:first-child{min-width:145px}
.core-compare-table th.num,.core-compare-table td.num{min-width:70px;white-space:nowrap}
.core-compare-table .series-cell{vertical-align:middle;white-space:nowrap;line-height:1.18}
.core-compare-table .series-sub{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:500;white-space:nowrap}
@media(max-width:1420px){.grid.core-perf-split{grid-template-columns:1fr}.core-compare-table{min-width:0}}


.provider-scope-note{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);line-height:1.45}

/* v0.20.20 Core Portfolio Performance PM monitor */
.core-performance-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.grid.core-performance-chart-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}

.perf-wide-table{min-width:840px}
.annual-return-table{min-width:690px}
.monthly-return-table{min-width:1040px}
.period-label{white-space:nowrap;vertical-align:middle}
.perf-return{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:650}

@media(max-width:520px){.core-performance-kpis{grid-template-columns:1fr}}

.core-performance-head{align-items:flex-end}
.core-performance-controls{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.core-performance-note{line-height:1.45}

.core-performance-table-grid .series-cell{vertical-align:middle;line-height:1.18;min-width:168px}
.core-performance-table-grid .series-cell b{display:block;white-space:nowrap}
.core-performance-table-grid .series-sub{display:block;margin-top:3px;color:var(--muted);font-size:9px;font-weight:500;white-space:normal;line-height:1.2}
.core-performance-table-grid .core-perf-primary-row td{background:rgba(59,130,246,.028)}
.core-performance-table-grid .core-perf-primary-row .series-cell{box-shadow:inset 3px 0 0 #3b82f6}

.core-performance-table-grid>section:last-child .tbl td:first-child{min-width:154px}

@media(max-width:820px){.core-performance-head{align-items:flex-start}.core-performance-controls{justify-content:flex-start}}

(()=>{'use strict';

const n=x=>{if(x===null||x===undefined||String(x).trim()==='')return null;const v=Number(x);return Number.isFinite(v)?v:null};
const pct=(x,d=1)=>n(x)===null?'—':`${(n(x)*100).toFixed(d)}%`,num=(x,d=2)=>n(x)===null?'—':n(x).toFixed(d),multi=(x,d=2)=>n(x)===null?'—':`${n(x).toFixed(d)}×`;
const signed=(x,d=1)=>n(x)===null?'—':`${n(x)>=0?'+':''}${(n(x)*100).toFixed(d)}%`;
const disc=D.disclosure||{},latest=disc.latest_released_signal_period||'',holding=disc.completed_holding_month_cutoff||'',publicAsOf=disc.public_as_of_date||'';
const NAV=[['overview','◎','Overview'],['performance','⌁','Core Performance'],['portfolio','▥','Portfolio History'],['investor','₩','Investor / FX'],['system','◇','System & Disclosure']];let page='overview';
const COLORS={PDS_ACTIVE_CORE:'#7c3aed',ADAA:'#0f9f6e',F2R:'#2563eb',SPY_AGG_60_40:'#64748b',BIL_CASH:'#94a3b8',CORE_USD:'#64748b',UNHEDGED_KRW:'#d97706',FIXED50_COSTED:'#0891b2',DYNAMIC_COSTED:'#8b5cf6'};
const LABELS={PDS_ACTIVE_CORE:'PDS Core · USD',ADAA:'ADAA',F2R:'F2R',SPY_AGG_60_40:'60/40',BIL_CASH:'BIL Cash',CORE_USD:'Core · USD',UNHEDGED_KRW:'KRW Unhedged',FIXED50_COSTED:'KRW · Fixed 50',DYNAMIC_COSTED:'KRW Investor View · Dynamic FX'};
const coreSummary=id=>D.coreSummary.find(r=>r.series_id===id)||{},fxSummary=id=>D.fxSummary.find(r=>r.series_id===id)||{};
const byMonth=(a,b)=>String(a.holding_month||a.period||'').localeCompare(String(b.holding_month||b.period||''));
function badge(text,kind='soft'){return `<span class="pill ${kind}">${esc(text)}</span>`}
function pagehead(title,copy,tag='DELAYED PUBLIC',kind='accent'){return `<div class="pagehead"><div><div class="eyebrow">PDS · PUBLIC OPERATING EVIDENCE</div><h2>${esc(title)}</h2><p>${esc(copy)}</p></div>${badge(tag,kind)}</div>`}
function releaseBand(){return `<div class="notice info global-time-notice"><strong>Governed delayed profile.</strong> Public evidence is released through completed holding <b>${esc(holding)}</b>. Current asset targets, Forward Preview, Forward Shadow, current mark, and current FX state remain private.</div><div class="global-data-clock official-only"><div><span>Public snapshot</span><b>${esc(publicAsOf||'—')}</b></div><div><span>Latest released signal</span><b>${esc(latest||'—')}</b></div><div><span>Completed holding</span><b>${esc(holding||'—')}</b></div><div><span>Core definition</span><b>F2R 25% · ADAA 75%</b></div></div>`}
function pathRows(source,id){return source.filter(r=>r.series_id===id).slice().sort(byMonth)}
function wealthStats(source,id){const rows=pathRows(source,id);if(!rows.length)return{};return {last:rows.at(-1),rows}}
function trailing(source,id,months){const a=pathRows(source,id);if(a.length<months)return null;return a.slice(-months).reduce((w,r)=>w*(1+n(r.net_return)),1)-1}
function ytd(source,id){const a=pathRows(source,id),last=a.at(-1)?.holding_month||'';if(!last)return null;const y=last.slice(0,4),r=a.filter(x=>String(x.holding_month).startsWith(y));return r.reduce((w,x)=>w*(1+n(x.net_return)),1)-1}
function chart(source,ids,field='cumulative_wealth',kind='wealth'){
 const series=ids.map(id=>({id,rows:pathRows(source,id).filter(r=>n(r[field])!==null)})).filter(s=>s.rows.length);if(!series.length)return'<div class="empty">No released history.</div>';
 const months=[...new Set(series.flatMap(s=>s.rows.map(r=>r.holding_month)))].sort(),ix=new Map(months.map((m,i)=>[m,i]));let vals=series.flatMap(s=>s.rows.map(r=>n(r[field])));let lo=Math.min(...vals),hi=Math.max(...vals);if(kind==='drawdown'){hi=0;lo=Math.min(lo,0)}if(hi<=lo){hi=lo+1}const W=1000,H=260,L=52,R=20,T=16,B=30,x=m=>L+(months.length<=1?.5:(ix.get(m)||0)/(months.length-1))*(W-L-R),y=v=>T+(hi-v)/(hi-lo)*(H-T-B);let svg=`<svg class="public-chart-svg" viewBox="0 0 ${W} ${H}" role="img">`;
 for(let g=0;g<5;g++){const v=hi-(hi-lo)*g/4,yy=y(v);svg+=`<line class="public-chart-grid" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="public-axis-label" x="${L-7}" y="${yy+3}" text-anchor="end">${kind==='drawdown'?pct(v,0):num(v,2)}</text>`}if(kind==='drawdown'&&lo<0){svg+=`<line class="public-chart-zero" x1="${L}" y1="${y(0)}" x2="${W-R}" y2="${y(0)}"/>`}
 series.forEach(s=>{const pts=s.rows.map((r,i)=>`${i?'L':'M'}${x(r.holding_month).toFixed(1)},${y(n(r[field])).toFixed(1)}`).join(' ');svg+=`<path class="public-chart-line" stroke="${COLORS[s.id]||'#2563eb'}" d="${pts}"/>`});
 const ticks=[0,.25,.5,.75,1].map(q=>Math.round(q*(months.length-1))).filter((v,i,a)=>a.indexOf(v)===i);ticks.forEach((j,i)=>{const m=months[j],anchor=i===0?'start':i===ticks.length-1?'end':'middle';svg+=`<text class="public-axis-label" x="${x(m)}" y="${H-7}" text-anchor="${anchor}">${esc(m)}</text>`});svg+='</svg>';return svg+`<div class="public-legend">${ids.map(id=>`<span><i style="background:${COLORS[id]||'#2563eb'}"></i>${esc(LABELS[id]||id)}</span>`).join('')}</div>`;
}
function statGrid(s,id,source,investor=false){return `<div class="public-stat-grid"><div class="kpi accented"><div class="k">CAGR</div><div class="v">${pct(s.cagr)}</div><div class="note">completed history</div></div><div class="kpi"><div class="k">Cumulative</div><div class="v">${pct(s.cumulative_return)}</div><div class="note">since inception</div></div><div class="kpi"><div class="k">YTD</div><div class="v">${pct(ytd(source,id))}</div><div class="note">completed months</div></div><div class="kpi"><div class="k">Volatility</div><div class="v">${pct(s.ann_vol)}</div><div class="note">annualized</div></div><div class="kpi"><div class="k">Sharpe · rf=0</div><div class="v">${num(s.sharpe_rf0)}</div><div class="note">annualized</div></div><div class="kpi"><div class="k">Max Drawdown</div><div class="v">${pct(s.max_drawdown)}</div><div class="note">peak-to-trough</div></div><div class="kpi"><div class="k">Calmar</div><div class="v">${num(s.calmar)}</div><div class="note">CAGR / |MDD|</div></div></div>`}
function summaryTable(ids,source='core'){return `<div class="tablewrap"><table class="tbl public-table"><thead><tr><th>Series</th><th class="num">CAGR</th><th class="num">Vol</th><th class="num">Sharpe</th><th class="num">MDD</th><th class="num">Calmar</th><th class="num">Terminal</th></tr></thead><tbody>${ids.map(id=>{const s=source==='core'?coreSummary(id):fxSummary(id),cls=id==='PDS_ACTIVE_CORE'?'primary-row':id==='DYNAMIC_COSTED'?'investor-row':'';return `<tr class="${cls}"><td><b>${esc(LABELS[id]||s.display_name||id)}</b></td><td class="num">${pct(s.cagr)}</td><td class="num">${pct(s.ann_vol)}</td><td class="num">${num(s.sharpe_rf0)}</td><td class="num">${pct(s.max_drawdown)}</td><td class="num">${num(s.calmar)}</td><td class="num">${multi(s.terminal_wealth)}</td></tr>`}).join('')}</tbody></table></div>`}
function annualRows(ids){const coreMap=new Map(D.coreCalendar.map(r=>[`${r.year}|${r.series_id}`,r])),fxMap=new Map(D.fxCalendar.map(r=>[`${r.year}|${r.series_id}`,r])),years=[...new Set([...D.coreCalendar,...D.fxCalendar].map(r=>r.year))].sort().reverse();return `<div class="tablewrap"><table class="tbl public-table compact"><thead><tr><th>Year</th>${ids.map(id=>`<th class="num">${esc(LABELS[id]||id)}</th>`).join('')}</tr></thead><tbody>${years.slice(0,12).map(y=>`<tr><td><b>${esc(y)}</b></td>${ids.map(id=>{const r=coreMap.get(`${y}|${id}`)||fxMap.get(`${y}|${id}`);return `<td class="num">${r?pct(r.annual_return):'—'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function monthMatrix(source,id,years=6){const a=pathRows(source,id),ys=[...new Set(a.map(r=>String(r.holding_month).slice(0,4)))].sort().reverse().slice(0,years),mp=new Map(a.map(r=>[r.holding_month,n(r.net_return)]));return `<div class="tablewrap"><table class="tbl matrix-table"><thead><tr><th>Year</th>${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map(m=>`<th class="num">${m}</th>`).join('')}<th class="num">Year</th></tr></thead><tbody>${ys.map(y=>{const vals=Array.from({length:12},(_,i)=>mp.get(`${y}-${String(i+1).padStart(2,'0')}`));const obs=vals.filter(v=>v!==undefined&&v!==null),yr=obs.length?obs.reduce((w,v)=>w*(1+v),1)-1:null;return `<tr><td><b>${y}</b></td>${vals.map(v=>`<td class="num ${v===undefined||v===null?'':v>=0?'up':'down'}">${v===undefined||v===null?'—':pct(v)}</td>`).join('')}<td class="num"><b>${pct(yr)}</b></td></tr>`}).join('')}</tbody></table></div>`}
function coreProviderReturnTable(limit=12){const ids=['PDS_ACTIVE_CORE','F2R','ADAA'],maps=Object.fromEntries(ids.map(id=>[id,new Map(pathRows(D.corePath,id).map(r=>[r.holding_month,n(r.net_return)]))])),periods=pathRows(D.corePath,'PDS_ACTIVE_CORE').map(r=>r.holding_month).slice(-limit).reverse();return `<div class="tablewrap"><table class="tbl public-table compact no-min core-provider-monthly-table"><thead><tr><th>Holding</th><th class="num">PDS Core</th><th class="num">F2R</th><th class="num">ADAA</th></tr></thead><tbody>${periods.map(m=>`<tr><td><b>${esc(m)}</b></td>${ids.map(id=>{const v=maps[id].get(m);return `<td class="num ${v===null||v===undefined?'':v>=0?'up':'down'}">${v===null||v===undefined?'—':pct(v,2)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`}
function latestAssets(){return D.assets.filter(r=>r.signal_period===latest).slice().sort((a,b)=>n(b.aggregate_weight)-n(a.aggregate_weight))}
function allocationBars(rows){const max=Math.max(...rows.map(r=>n(r.aggregate_weight)||0),.01);return `<div class="allocation-bars">${rows.map(r=>`<div class="allocation-row"><span><b>${esc(r.asset_id)}</b></span><div class="allocation-track"><div class="allocation-fill" style="width:${Math.max(1,(n(r.aggregate_weight)||0)/max*100).toFixed(2)}%"></div></div><b>${pct(r.aggregate_weight,2)}</b></div>`).join('')}</div>`}
function oneWay(){const periods=[...new Set(D.assets.map(r=>r.signal_period))].sort();if(periods.length<2)return null;const cur=periods.at(-1),prev=periods.at(-2),a=new Map(D.assets.filter(r=>r.signal_period===cur).map(r=>[r.asset_id,n(r.aggregate_weight)||0])),b=new Map(D.assets.filter(r=>r.signal_period===prev).map(r=>[r.asset_id,n(r.aggregate_weight)||0])),keys=new Set([...a.keys(),...b.keys()]);let s=0;keys.forEach(k=>s+=Math.abs((a.get(k)||0)-(b.get(k)||0)));return {value:.5*s,prev,cur}}
function overview(){const core=coreSummary('PDS_ACTIVE_CORE'),inv=fxSummary('DYNAMIC_COSTED'),last=wealthStats(D.corePath,'PDS_ACTIVE_CORE').last||{},a=latestAssets(),ow=oneWay();return `${pagehead('Portfolio Decision System','Governed multi-strategy portfolio operating system · delayed public evidence','PUBLIC PRODUCT','good')}
<section class="public-hero"><div class="public-hero-main"><div><div class="hero-eyebrow">LATEST RELEASED PDS CORE</div><h2>F2R + ADAA</h2><p>Fixed Core policy across the displayed history · current decision-sensitive state remains private.</p></div><div class="hero-weight"><span>F2R</span><b>25%</b></div><div class="hero-weight"><span>ADAA</span><b>75%</b></div></div><div class="public-state-grid"><div><span>Latest released signal</span><b>${esc(latest)}</b></div><div><span>Completed holding</span><b>${esc(holding)}</b></div><div><span>Latest completed Core return</span><b>${pct(last.net_return,2)}</b></div><div><span>Public snapshot</span><b>${esc(publicAsOf||'—')}</b></div></div></section>
<div class="public-section-title"><div><h3>Decision & investor headline</h3><p>USD Core remains the portfolio-decision reference; the KRW layer is a delayed historical implementation sensitivity.</p></div></div>
<div class="public-layer-strip"><div class="layer-title"><span>Decision portfolio</span><b>PDS Core · USD</b><small>F2R 25% + ADAA 75%</small></div><div><span>CAGR</span><b>${pct(core.cagr)}</b></div><div><span>Sharpe</span><b>${num(core.sharpe_rf0)}</b></div><div><span>MDD</span><b>${pct(core.max_drawdown)}</b></div></div>
<div class="public-layer-strip section"><div class="layer-title"><span>KRW investor view</span><b>Core 25/75 + Dynamic FX</b><small>Delayed non-canonical spot sensitivity · costed history</small></div><div><span>CAGR</span><b>${pct(inv.cagr)}</b></div><div><span>Sharpe</span><b>${num(inv.sharpe_rf0)}</b></div><div><span>MDD</span><b>${pct(inv.max_drawdown)}</b></div></div>
<div class="public-holding-grid section"><section class="panel"><div class="panel-title"><div><h3>Latest released look-through portfolio</h3><p>Signal ${esc(latest)} · completed holding ${esc(holding)}</p></div>${badge('RELEASED TARGET','accent')}</div>${allocationBars(a.slice(0,12))}<div class="public-footnote">Top-level Core weights are fixed 25/75. Asset weights reflect the released provider targets for the historical signal month.</div></section><section class="panel"><div class="panel-title"><div><h3>Recent completed returns</h3><p>PDS Core and source-owned providers · latest six released holding months</p></div>${badge('COMPLETED','good')}</div>${coreProviderReturnTable(6)}${ow?`<div class="public-footnote">Latest released target-to-target one-way change: <b>${pct(ow.value,1)}</b> (${esc(ow.prev)} → ${esc(ow.cur)}).</div>`:''}</section></div>
<div class="boundary-grid section"><section class="boundary-card"><h3>What the public dashboard shows</h3><div class="boundary-list"><div><span>Core definition</span><b>F2R 25% + ADAA 75%</b></div><div><span>Completed performance</span><b>Public</b></div><div><span>Released portfolio history</span><b>Public</b></div><div><span>Delayed FX sensitivity history</span><b>Public · non-canonical</b></div></div></section><section class="boundary-card"><h3>What remains private</h3><div class="boundary-list"><div><span>Current asset target</span><b>Private</b></div><div><span>Forward Preview</span><b>Private</b></div><div><span>Forward Shadow state</span><b>Private</b></div><div><span>Current mark / FX state</span><b>Private</b></div></div></section></div>`}
function performance(){const core=coreSummary('PDS_ACTIVE_CORE'),inv=fxSummary('DYNAMIC_COSTED'),ids=['PDS_ACTIVE_CORE','ADAA','F2R','SPY_AGG_60_40'];return `${pagehead('Core Performance','Completed daily-accounting evidence for the fixed 25/75 PDS Core')}${releaseBand()}<div class="public-section-title"><div><h3>PDS Core · USD</h3><p>Primary portfolio-decision performance layer.</p></div><span class="public-profile-tag primary">PRIMARY CORE</span></div>${statGrid(core,'PDS_ACTIVE_CORE',D.corePath)}
<div class="grid cols2 section"><section class="chart"><h3>Cumulative net wealth</h3><p>Common completed support</p>${chart(D.corePath,ids,'cumulative_wealth','wealth')}</section><section class="chart"><h3>Drawdown</h3><p>Peak-to-trough daily-accounting path</p>${chart(D.corePath,ids,'drawdown','drawdown')}</section></div>
<section class="panel section"><div class="panel-title"><div><h3>Core risk / return comparison</h3><p>Same public completed-history definition</p></div></div>${summaryTable(ids,'core')}</section>
<section class="panel section"><div class="panel-title"><div><h3>Recent monthly returns · Core / providers</h3><p>Completed delayed returns · latest 12 holding months</p></div>${badge('CORE + PROVIDERS','soft')}</div>${coreProviderReturnTable(12)}<div class="public-footnote">F2R and ADAA remain independent source-owned provider strategies; the table is a performance comparison, not a change in PDS provider ownership.</div></section>
<div class="public-section-title"><div><h3>KRW Investor View</h3><p>Core 25/75 + Dynamic FX · completed delayed sensitivity only.</p></div><span class="public-profile-tag investor">DELAYED SENSITIVITY</span></div><div class="public-callout"><strong>Authority boundary.</strong> This KRW path is the governed historical Dynamic-FX spot-sensitivity implementation view with its stated cost convention. It is not promoted here to certified forward/NDF canonical performance and no current hedge state is published.</div>${statGrid(inv,'DYNAMIC_COSTED',D.fxPath,true)}
<div class="grid cols2 section"><section class="chart"><h3>Investor wealth</h3><p>Dynamic FX costed vs Core USD</p>${chart(D.fxPath,['CORE_USD','DYNAMIC_COSTED'],'cumulative_wealth','wealth')}</section><section class="chart"><h3>Investor drawdown</h3><p>Completed history only</p>${chart(D.fxPath,['CORE_USD','DYNAMIC_COSTED'],'drawdown','drawdown')}</section></div>
<section class="panel section"><div class="panel-title"><div><h3>Annual performance</h3><p>Core and investor context</p></div></div>${annualRows(['PDS_ACTIVE_CORE','ADAA','F2R','SPY_AGG_60_40','DYNAMIC_COSTED'])}</section>
<details class="core-investor-detail section"><summary><span><b>Monthly returns · PDS Core</b><small>Latest six calendar years</small></span><span>Show history</span></summary><div style="padding:0 14px 14px">${monthMatrix(D.corePath,'PDS_ACTIVE_CORE')}</div></details><details class="core-investor-detail section"><summary><span><b>Monthly returns · KRW Investor View</b><small>Dynamic FX costed · delayed sensitivity</small></span><span>Show history</span></summary><div style="padding:0 14px 14px">${monthMatrix(D.fxPath,'DYNAMIC_COSTED')}</div></details>`}
function portfolio(){const a=latestAssets(),periods=[...new Set(D.assets.map(r=>r.signal_period))].sort(),last12=periods.slice(-12),assetSet=[...new Set(D.assets.filter(r=>last12.includes(r.signal_period)).map(r=>r.asset_id))],lookup=new Map(D.assets.map(r=>[`${r.signal_period}|${r.asset_id}`,n(r.aggregate_weight)])),ow=oneWay();return `${pagehead('Portfolio History','Released historical look-through targets · current target remains private')}${releaseBand()}<div class="public-holding-grid"><section class="panel"><div class="panel-title"><div><h3>Latest released portfolio</h3><p>Signal ${esc(latest)} → completed holding ${esc(holding)}</p></div>${badge('RELEASED','good')}</div>${allocationBars(a)}</section><section class="panel"><div class="panel-title"><div><h3>Portfolio policy</h3><p>Top-level provider allocation</p></div>${badge('FIXED','accent')}</div><div class="status-list"><div class="status-row"><span>F2R</span><b>25%</b></div><div class="status-row"><span>ADAA</span><b>75%</b></div><div class="status-row"><span>Definition</span><b>Fixed over displayed history</b></div><div class="status-row"><span>Latest target change</span><b>${ow?pct(ow.value,1):'—'} one-way</b></div></div><div class="public-footnote">Provider identities remain source-owned. PDS combines their released target books under the fixed Core policy.</div></section></div>
<section class="panel section"><div class="panel-title"><div><h3>Look-through allocation history</h3><p>Recent 12 released signal months · percentages</p></div></div><div class="tablewrap"><table class="tbl public-table"><thead><tr><th>Asset</th>${last12.map(m=>`<th class="num">${esc(m)}</th>`).join('')}</tr></thead><tbody>${assetSet.sort().map(asset=>`<tr><td><b>${esc(asset)}</b></td>${last12.map(m=>`<td class="num">${pct(lookup.get(`${m}|${asset}`),1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>
<section class="panel section"><div class="panel-title"><div><h3>Released provider-weight history</h3><p>Audit view of the fixed Core contract</p></div></div><div class="tablewrap"><table class="tbl public-table compact"><thead><tr><th>Signal</th><th>Holding</th><th class="num">F2R</th><th class="num">ADAA</th><th>Basis</th></tr></thead><tbody>${D.weights.slice().sort((x,y)=>y.signal_period.localeCompare(x.signal_period)).slice(0,24).map(r=>`<tr><td><b>${esc(r.signal_period)}</b></td><td>${esc(r.holding_month)}</td><td class="num">${pct(r.f2r_weight,0)}</td><td class="num">${pct(r.adaa_weight,0)}</td><td>${esc(String(r.weight_basis||'').replaceAll('_',' '))}</td></tr>`).join('')}</tbody></table></div></section>`}
function investor(){const ids=['CORE_USD','UNHEDGED_KRW','FIXED50_COSTED','DYNAMIC_COSTED'],dyn=fxSummary('DYNAMIC_COSTED'),h=D.fxHedge.slice().sort((a,b)=>b.holding_month.localeCompare(a.holding_month));return `${pagehead('Investor / FX Performance','Historical KRW implementation sensitivity · completed and delayed')}${releaseBand()}<div class="public-callout"><strong>Important.</strong> The Dynamic-FX series is released as delayed historical non-canonical spot sensitivity. Current hedge ratio, current z-score, current FX mark, and Preview state are not exported.</div><div class="public-section-title"><div><h3>KRW Investor View · Dynamic FX</h3><p>Costed historical sensitivity path for the fixed 25/75 Core.</p></div><span class="public-profile-tag investor">DELAYED · NON-CANONICAL</span></div>${statGrid(dyn,'DYNAMIC_COSTED',D.fxPath,true)}
<div class="grid cols2 section"><section class="chart"><h3>Currency-treatment wealth</h3><p>USD base vs KRW translation / hedge sensitivities</p>${chart(D.fxPath,ids,'cumulative_wealth','wealth')}</section><section class="chart"><h3>Drawdown by currency treatment</h3><p>Completed support</p>${chart(D.fxPath,ids,'drawdown','drawdown')}</section></div>
<section class="panel section"><div class="panel-title"><div><h3>Risk / return comparison</h3><p>Governed delayed history</p></div></div>${summaryTable(ids,'fx')}</section><section class="panel section"><div class="panel-title"><div><h3>Annual returns by currency treatment</h3><p>Historical public sensitivity layer</p></div></div>${annualRows(ids)}</section>
<section class="panel section"><div class="panel-title"><div><h3>Released hedge-state history</h3><p>Historical states only · latest 24 completed holdings</p></div>${badge('DELAYED HISTORY','soft')}</div><div class="tablewrap"><table class="tbl public-table compact"><thead><tr><th>Signal</th><th>Holding</th><th class="num">Z-score</th><th class="num">Dynamic hedge</th></tr></thead><tbody>${h.slice(0,24).map(r=>`<tr><td><b>${esc(r.signal_period)}</b></td><td>${esc(r.holding_month)}</td><td class="num">${num(r.zscore_signal)}</td><td class="num">${pct(r.dynamic_hedge_ratio,0)}</td></tr>`).join('')}</tbody></table></div></section>`}
function system(){return `${pagehead('System & Disclosure','How PDS turns independent provider evidence into one governed portfolio decision')}${releaseBand()}<section class="panel"><div class="panel-title"><div><h3>Decision architecture</h3><p>Provider independence is preserved through the portfolio operating layer.</p></div>${badge('RS-03','accent')}</div><div class="architecture-flow"><div class="architecture-step"><span>01</span><b>Provider intake</b><p>Independent strategy systems enter through explicit source boundaries.</p></div><div class="architecture-step"><span>02</span><b>Qualification</b><p>Evidence, data integrity, timing and operating readiness are checked.</p></div><div class="architecture-step"><span>03</span><b>Portfolio admission</b><p>Incremental portfolio role is assessed separately from scientific validity.</p></div><div class="architecture-step"><span>04</span><b>Integration</b><p>Approved providers are combined under the governed fixed Core policy.</p></div><div class="architecture-step"><span>05</span><b>Monitor & release</b><p>Private operation and delayed public evidence follow separate disclosure clocks.</p></div></div></section>
<div class="boundary-grid section"><section class="boundary-card"><h3>Canonical operating contract</h3><div class="boundary-list"><div><span>Core</span><b>F2R 25% + ADAA 75%</b></div><div><span>Rebalancing</span><b>Monthly execution only · daily weights drift</b></div><div><span>Execution</span><b>First next common trading-day close</b></div><div><span>Old portfolio earns through</span><b>Execution close</b></div><div><span>New target earns from</span><b>Next close-to-close interval</b></div><div><span>Top-level cost</span><b>10 bp buy + 10 bp sell</b></div></div></section><section class="boundary-card"><h3>Public disclosure contract</h3><div class="boundary-list"><div><span>Architecture / Core policy</span><b>PUBLIC</b></div><div><span>Completed performance</span><b>PUBLIC</b></div><div><span>Released portfolio history</span><b>DELAYED</b></div><div><span>Current target / Preview / Shadow</span><b>PRIVATE</b></div><div><span>Current mark / current FX</span><b>PRIVATE</b></div></div></section></div>
<div class="grid cols2 section"><section class="panel"><div class="panel-title"><div><h3>ADAA</h3><p>Portfolio Strategy System · Decision Diversification</p></div><span class="public-profile-tag">PROVIDER</span></div><p class="muted">Independent multi-asset strategy provider. Its internal strategy logic and evidence lineage remain ADAA-owned.</p><a class="public-provider-link" href="/systems/adaa/" target="_top">View ADAA →</a></section><section class="panel"><div class="panel-title"><div><h3>Forecast-to-Rank Allocation (F2R)</h3><p>Machine-Learning Cross-Asset Portfolio Strategy</p></div><span class="public-profile-tag">PROVIDER</span></div><p class="muted">Independent forecast-ranked strategy provider. PDS consumes governed target outputs without recreating provider science.</p><a class="public-provider-link" href="/systems/f2r/" target="_top">View F2R →</a></section></div><div class="notice info section"><strong>Why the delay exists.</strong> Historical operating decisions and performance can be inspected without turning the public site into a live portfolio-instruction feed.</div>`}
function shell(content){const nav=`<div class="nav-section">Public dashboard</div><div class="public-nav-note">Completed evidence · current decision state protected</div>${NAV.map(([k,ic,t])=>`<button data-page="${k}" class="${page===k?'active':''}"><span class="nav-icon">${ic}</span>${t}</button>`).join('')}`;return `<div class="app-shell"><aside class="sidebar"><div class="brand-lockup"><div class="brand-mark"></div><div><div class="brand-name">SlackQuant</div><div class="brand-sub">Systems</div></div></div><div class="side-nav">${nav}</div><div class="side-bottom"><b>RS-03 · Portfolio Decision System</b>Governed delayed public profile.<br>Current decision-sensitive state stays private.<br><br><a href="/systems/pds/" target="_top">← PDS system page</a></div></aside><div class="main"><header class="topbar"><div class="product-title"><div class="pds-product-kicker">SlackQuant Systems · RS-03</div><h1>Portfolio Decision System</h1></div><div class="modebox">${badge('DELAYED PUBLIC','accent')}${badge(`Through ${holding}`,'dark')}</div></header><main class="wrap">${content}<div class="footer"><span><b>SlackQuant Systems</b> · Portfolio Decision System · Public Read Model</span><span>Completed / delayed evidence only · current decision-sensitive state protected.</span></div></main></div></div>`}
function render(){const f={overview,performance,portfolio,investor,system};app.innerHTML=shell(f[page]());app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render();window.scrollTo(0,0)})}render();})();
</script></body></html>
