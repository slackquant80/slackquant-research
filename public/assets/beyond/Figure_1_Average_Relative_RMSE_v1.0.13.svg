<rect class="bar" x="255.0" y="332.7" width="625.0" height="26.6"/>
<text class="axis" x="872.0" y="352.0" text-anchor="end" fill="#ffffff" style="fill:#fff">0.869</text>
<text class="label" x="239" y="395.0" text-anchor="end">Median Ensemble</text>
<rect class="bar" x="255.0" y="375.7" width="617.6" height="26.6"/>
<text class="axis" x="864.6" y="395.0" text-anchor="end" fill="#ffffff" style="fill:#fff">0.859</text>
<text class="label" x="239" y="437.9" text-anchor="end">Inverse-RMSE Ensemble</text>
<rect class="bar" x="255.0" y="418.6" width="609.9" height="26.6"/>
<text class="axis" x="856.9" y="437.9" text-anchor="end" fill="#ffffff" style="fill:#fff">0.848</text>
