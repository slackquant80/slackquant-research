<rect class="bar" x="255.0" y="547.3" width="593.0" height="26.6"/>
<text class="axis" x="840.0" y="566.6" text-anchor="end" fill="#ffffff" style="fill:#fff">0.825</text>
<text class="label" x="239" y="609.5" text-anchor="end">XGBoost</text>
<rect class="bar" x="255.0" y="590.2" width="590.6" height="26.6"/>
<text class="axis" x="837.6" y="609.5" text-anchor="end" fill="#ffffff" style="fill:#fff">0.821</text>
<text class="axis" x="632.5" y="694" text-anchor="middle">Mean RMSE relative to RW (lower is better)</text>
</svg>
