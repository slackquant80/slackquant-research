<text class="label" x="239" y="223.3" text-anchor="end">Factor</text>
<rect class="bar" x="255.0" y="204.0" width="687.6" height="26.6"/>
<text class="axis" x="934.6" y="223.3" text-anchor="end" fill="#ffffff" style="fill:#fff">0.956</text>
<text class="label" x="239" y="266.2" text-anchor="end">LASSO</text>
<rect class="bar" x="255.0" y="246.9" width="678.1" height="26.6"/>
<text class="axis" x="925.1" y="266.2" text-anchor="end" fill="#ffffff" style="fill:#fff">0.943</text>
<text class="label" x="239" y="309.1" text-anchor="end">Ridge</text>
<rect class="bar" x="255.0" y="289.8" width="669.7" height="26.6"/>
<text class="axis" x="916.7" y="309.1" text-anchor="end" fill="#ffffff" style="fill:#fff">0.931</text>
