<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 705" role="img" aria-labelledby="title desc">
<title id="title">Average RMSE relative to the RW persistence benchmark</title>
<desc id="desc">Horizontal bars show mean relative RMSE across sixteen target-horizon combinations. Lower is better. The dashed line at one indicates equality with the persistence benchmark.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202428}.title{font-family:Georgia,serif;font-size:30px}.axis{font-size:16px}.label{font-size:17px}.note{font-size:14px;fill:#5d6267}.grid{stroke:#e1e3df;stroke-width:1}.bar{fill:#1d4f66}.benchmark{stroke:#6a6f73;stroke-width:2;stroke-dasharray:8 7}</style>
<text class="title" x="540.0" y="48" text-anchor="middle">Average Relative RMSE Across 16 Target-Horizon Combinations</text>
<line class="grid" x1="255.0" y1="110" x2="255.0" y2="625"/>
<text class="axis" x="255.0" y="655" text-anchor="middle">0.0</text>
<line class="grid" x1="398.8" y1="110" x2="398.8" y2="625"/>
<text class="axis" x="398.8" y="655" text-anchor="middle">0.2</text>
<line class="grid" x1="542.6" y1="110" x2="542.6" y2="625"/>
<text class="axis" x="542.6" y="655" text-anchor="middle">0.4</text>
<line class="grid" x1="686.4" y1="110" x2="686.4" y2="625"/>
<text class="axis" x="686.4" y="655" text-anchor="middle">0.6</text>
<line class="grid" x1="830.2" y1="110" x2="830.2" y2="625"/>
<text class="axis" x="830.2" y="655" text-anchor="middle">0.8</text>
<line class="grid" x1="974.0" y1="110" x2="974.0" y2="625"/>
<text class="axis" x="974.0" y="655" text-anchor="middle">1.0</text>
<line class="benchmark" x1="974.0" y1="102" x2="974.0" y2="631"/>
<text class="label" x="239" y="137.5" text-anchor="end">Elastic Net</text>
<rect class="bar" x="255.0" y="118.2" width="725.4" height="26.6"/>
<text class="axis" x="972.4" y="137.5" text-anchor="end" fill="#ffffff" style="fill:#fff">1.009</text>
<text class="label" x="239" y="180.4" text-anchor="end">RW</text>
<rect class="bar" x="255.0" y="161.1" width="719.0" height="26.6"/>
