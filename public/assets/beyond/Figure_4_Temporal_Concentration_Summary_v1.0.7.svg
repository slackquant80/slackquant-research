<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 565" role="img" aria-labelledby="title desc">
<title id="title">Temporal concentration of gross squared-loss reductions and increases relative to RW</title>
<desc id="desc">Two bars show the average share of gross favorable reductions and unfavorable increases attributable to the twelve largest months: 85.6 percent and 89.1 percent.</desc>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#202428}.title{font-family:Georgia,serif;font-size:28px}.axis{font-size:16px}.label{font-size:18px}.value{font-family:Georgia,serif;font-size:30px}.note{font-size:14px;fill:#5d6267}.grid{stroke:#e1e3df;stroke-width:1}.bar{fill:#1d4f66}</style>
<text class="title" x="540.0" y="47" text-anchor="middle">Temporal Concentration of Gross Squared-Loss Changes Relative to RW</text>
<text class="note" x="540.0" y="78" text-anchor="middle">Average share attributable to the 12 largest months within each non-benchmark model-target-horizon combination</text>
<line class="grid" x1="115.0" y1="125" x2="115.0" y2="480"/>
<text class="axis" x="115.0" y="512" text-anchor="middle">0%</text>
<line class="grid" x1="294.0" y1="125" x2="294.0" y2="480"/>
<text class="axis" x="294.0" y="512" text-anchor="middle">20%</text>
<line class="grid" x1="473.0" y1="125" x2="473.0" y2="480"/>
<text class="axis" x="473.0" y="512" text-anchor="middle">40%</text>
<line class="grid" x1="652.0" y1="125" x2="652.0" y2="480"/>
<text class="axis" x="652.0" y="512" text-anchor="middle">60%</text>
<line class="grid" x1="831.0" y1="125" x2="831.0" y2="480"/>
<text class="axis" x="831.0" y="512" text-anchor="middle">80%</text>
<line class="grid" x1="1010.0" y1="125" x2="1010.0" y2="480"/>
<text class="axis" x="1010.0" y="512" text-anchor="middle">100%</text>
<text class="label" x="115" y="186" text-anchor="start">12 largest favorable monthly loss reductions</text>
<rect class="bar" x="115" y="210" width="766.1" height="52"/>
<text class="value" x="867.1" y="247" text-anchor="end" style="fill:#fff">85.6%</text>
<text class="label" x="115" y="326" text-anchor="start">12 largest unfavorable monthly loss increases</text>
<rect class="bar" x="115" y="350" width="797.4" height="52"/>
<text class="value" x="898.4" y="387" text-anchor="end" style="fill:#fff">89.1%</text>
<text class="axis" x="562.5" y="555" text-anchor="middle">Share of gross reduction / increase explained by the 12 largest months</text>
</svg>
