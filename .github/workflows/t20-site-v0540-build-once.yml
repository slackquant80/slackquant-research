name: T20 SlackQuant v0.5.40 site draft typecheck and static build (one run)

on:
  push:
    branches:
      - review/t20-figure6-v101-site-20261115
    paths:
      - .github/workflows/t20-site-v0540-build-once.yml

permissions:
  contents: read

jobs:
  site-draft-qa-no-deploy:
    if: github.repository == 'slackquant80/slackquant-research'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact site lockfile
        run: npm ci --ignore-scripts
      - name: Verify TypeScript and static export (no deploy)
        run: |
          set -euo pipefail
          npm run typecheck
          npm run build
      - name: Verify new scientific chart and exported page match draft statements
        run: |
          set -euo pipefail
          test -s public/research/momentum/figure-6-industry-momentum.svg
          test -s public/research/momentum/figure-7-absolute-riskoff.svg
          test -s out/research/momentum-market-regularity/index.html
          grep -F 'figure-7-absolute-riskoff.svg' out/research/momentum-market-regularity/index.html
          grep -F 'Replication Code v1.0.2' out/research/momentum-market-regularity/index.html
          grep -F '10.22%' out/research/momentum-market-regularity/index.html
          grep -F '−44.50%' out/research/momentum-market-regularity/index.html
          grep -F 'Previous Software Archive v1.0.0' out/research/momentum-market-regularity/index.html
          if grep -F 'An illustrative monthly rebalanced 80:20 blend' out/research/momentum-market-regularity/index.html; then
            echo 'Obsolete AQR 80:20 statement remains'; exit 1
          fi
          echo T20_SITE_0540_STATIC_BUILD_FIGURE7_RELEASE_LINK_AND_WORDING_PASS
