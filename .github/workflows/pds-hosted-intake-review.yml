name: PDS Hosted Intake Review Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/receive-pds-hosted-intake.py"
      - "scripts/test-pds-hosted-intake.py"
      - "scripts/audit-pds-same-clock-html.py"
      - ".github/workflows/pds-hosted-intake-review.yml"
      - ".github/workflows/pds-hosted-intake-stage-pr.yml"
      - "scripts/bind-pds-public-export.py"
      - "scripts/bind-pds-canonical-summary.py"
      - "scripts/validate-pds-publication.py"
  push:
    branches: [main]
    paths:
      - "scripts/receive-pds-hosted-intake.py"
      - "scripts/test-pds-hosted-intake.py"
      - "scripts/audit-pds-same-clock-html.py"
      - ".github/workflows/pds-hosted-intake-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-source-artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile scripts/receive-pds-hosted-intake.py scripts/test-pds-hosted-intake.py scripts/audit-pds-same-clock-html.py
      - name: Reproducible PDS full HTML static audit negative fixtures
        run: python3 scripts/audit-pds-same-clock-html.py --selftest
      - name: One-time independently inspect PDS Draft PR 9 full canonical HTML bytes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            '+refs/heads/main:refs/remotes/origin/pds-audit-main' \
            '+refs/pull/9/head:refs/remotes/origin/pds-audit-review'
          mkdir -p "$RUNNER_TEMP/pds-html-review"
          git show 'refs/remotes/origin/pds-audit-main:public/assets/systems/pds/Portfolio_Decision_System_Public.html' > "$RUNNER_TEMP/pds-html-review/base.html"
          git show 'refs/remotes/origin/pds-audit-review:public/assets/systems/pds/Portfolio_Decision_System_Public.html' > "$RUNNER_TEMP/pds-html-review/candidate.html"
          python3 scripts/audit-pds-same-clock-html.py "$RUNNER_TEMP/pds-html-review/base.html" "$RUNNER_TEMP/pds-html-review/candidate.html"
      - name: Attack / exact-inventory / production-public-fixture / disposable-workspace binder tests
        run: python3 scripts/test-pds-hosted-intake.py
      - name: Parse hosted manual-stage workflow YAML (syntax only)
        run: ruby -e 'require "yaml"; YAML.parse_file(".github/workflows/pds-hosted-intake-stage-pr.yml"); puts "PDS_STAGE_WORKFLOW_YAML_PARSE_PASS"'
      - name: Assert short-lived source-only App token scope and safe PAT fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path(".github/workflows/pds-hosted-intake-stage-pr.yml").read_text()
          required = [
              "actions/create-github-app-token@v3",
              "client-id: ${{ vars.PDS_APP_CLIENT_ID }}",
              "private-key: ${{ secrets.PDS_APP_PRIVATE_KEY }}",
              "owner: slackquant80",
              "repositories: research-multiasset",
              "permission-contents: read",
              "vars.PDS_APP_CLIENT_ID",
              "steps.source-reader-app.outputs.token || secrets.PDS_SOURCE_READ_TOKEN",
              "gh release download",
              "PDS_PINNED_PRIVATE_TRANSPORT_SHA_PASS",
          ]
          for token in required:
              assert token in s, "PDS_AUTH_CONTRACT_MISSING: " + token
          assert "permission-contents: write" not in s
          print("PDS_ONE_HOUR_SOURCE_ONLY_APP_TOKEN_CONTRACT_PASS")
          PY
      - name: Verify this review workflow never deploys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('scripts/receive-pds-hosted-intake.py').read_text()
          w = Path('.github/workflows/pds-hosted-intake-review.yml').read_text()
          assert 'permissions:' in w and 'contents: read' in w
          for forbidden in ('subprocess.run(["git"', "os.system(", "os.popen(", "urllib.request.urlopen(", "requests.post("):
              assert forbidden not in s, forbidden
          assert 'contents: read' in w
          print('PDS_HOSTED_INTAKE_READ_ONLY_CI_PASS')
          PY
