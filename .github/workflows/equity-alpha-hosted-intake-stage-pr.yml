name: Stage Equity Alpha source artifact as Draft PR

# Manual source-owned artifact intake. No automatic merge or Pages publication.
on:
  workflow_dispatch:
    inputs:
      source_release_tag:
        required: true
        type: string
        description: "Pinned private research-equity-alpha release"
      expected_sha256:
        required: true
        type: string
        description: "SHA256 of EQUITY_ALPHA_HOSTED_INTAKE_CANDIDATE.zip"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: equity-alpha-hosted-intake-stage
  cancel-in-progress: false

jobs:
  stage-reviewed-equity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EA_TAG: ${{ inputs.source_release_tag }}
      EA_SHA: ${{ inputs.expected_sha256 }}
      EA_BRANCH: review/equity-alpha-hosted-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Source-only ephemeral GitHub App read token
        id: source-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.EQUITY_ALPHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.EQUITY_ALPHA_APP_PRIVATE_KEY }}
          owner: slackquant80
          repositories: research-equity-alpha
          permission-contents: read
      - name: Download exact private prerelease candidate
        shell: bash
        env:
          GH_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          [[ "$EA_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{1,100}$ ]] || exit 2
          [[ "$EA_SHA" =~ ^[a-f0-9]{64}$ ]] || exit 2
          test -n "$GH_TOKEN"
          gh release view "$EA_TAG" -R slackquant80/research-equity-alpha \
            --json isPrerelease,isDraft --jq 'select(.isPrerelease == true and .isDraft == false)' | grep -q .
          mkdir -p "$RUNNER_TEMP/equity-intake"
          gh release download "$EA_TAG" -R slackquant80/research-equity-alpha \
            --pattern EQUITY_ALPHA_HOSTED_INTAKE_CANDIDATE.zip --dir "$RUNNER_TEMP/equity-intake"
          echo "$EA_SHA  $RUNNER_TEMP/equity-intake/EQUITY_ALPHA_HOSTED_INTAKE_CANDIDATE.zip" | sha256sum -c -
      - name: Run compact hostile receiver tests and stage exact seven public assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-receive-equity-alpha-hosted-intake.py
          python3 scripts/receive-equity-alpha-hosted-intake.py \
            --candidate "$RUNNER_TEMP/equity-intake/EQUITY_ALPHA_HOSTED_INTAKE_CANDIDATE.zip" \
            --sha256 "$EA_SHA" --platform-root .
      - name: Validate only existing platform release gate
        run: |
          npm ci --no-audit --no-fund
          npm run validate:release
      - name: Stage only exact Equity Alpha asset boundary
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          git add -- public/dashboards/equity-alpha/
          python3 - <<'PY'
          import subprocess
          allowed={
              "public/dashboards/equity-alpha/index.html",
              "public/dashboards/equity-alpha/assets/app.js",
              "public/dashboards/equity-alpha/assets/holdings-view.js",
              "public/dashboards/equity-alpha/assets/styles.css",
              "public/dashboards/equity-alpha/data/dashboard_data.js",
              "public/dashboards/equity-alpha/data/live_overlay.js",
              "public/dashboards/equity-alpha/exports/Global_Equity_Alpha_Full_History.xlsx"
          }
          dirty=subprocess.check_output(["git","status","--porcelain=v1","--untracked-files=all"],text=True)
          for row in dirty.splitlines():
              if row[3:].split(" -> ")[-1].replace("\\","/") not in allowed:
                  raise SystemExit("EQUITY_UNRELATED_PLATFORM_EDIT_HOLD")
          print("EQUITY_EXACT_SEVEN_FILE_CHANGE_BOUNDARY_PASS")
          PY
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'EQUITY_NO_PUBLIC_DELTA_NO_PR'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Open bounded review branch and DRAFT PR, never main
        if: steps.stage.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'slackquant-equity-intake-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$EA_BRANCH"
          git commit -m "Stage Equity Alpha source-owned public assets (review only)"
          SQ_GOVERNED_GIT_PUSH=1 git push origin "$EA_BRANCH"
          gh pr create --draft --base "${{ github.ref_name }}" --head "$EA_BRANCH" \
            --title "Review Equity Alpha hosted intake: $EA_TAG" \
            --body "Private source release pinned: $EA_TAG. SHA256: $EA_SHA. Seven public assets only. Existing release checks passed. NOT MERGED OR DEPLOYED; independent approval required."
