name: T20 final public Zenodo DOI + 2 viewport browser audit (no deploy)
on:
  push:
    branches:
      - audit/t20-final-live-doi-browser-20261116
    paths:
      - .github/workflows/t20-final-live-doi-browser-once.yml
permissions:
  contents: read
jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: HTTP check public T20 link and current DOI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request
          from html import unescape
          url='https://research.slackquant.com/research/momentum-market-regularity/'
          with urllib.request.urlopen(url,timeout=15) as f:
              assert f.status==200, f.status
              html=unescape(f.read().decode('utf-8'))
          for needle in ['10.5281/zenodo.24268624','Zenodo Software Archive v1.0.3','figure-7-absolute-riskoff.svg','figure-6-industry-momentum.svg','7707479']:
              assert needle in html, needle
          assert 'Previous Software Archive v1.0.0' not in html
          print('T20_CURRENT_PUBLIC_DOI_AND_EXHIBITS_HTML_PASS')
          PY
      - name: Scoped desktop and mobile Chromium audit
        run: node scripts/check-site-browser.mjs --only-momentum --out /tmp/t20-momentum-qa
      - name: Retain exact public T20 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t20-live-doi-browser-qa
          path: /tmp/t20-momentum-qa/
          retention-days: 2
          if-no-files-found: warn
