name: Deploy SlackQuant Research to GitHub Pages

on:
  push:
    branches: ["main"]
    # A workflow-only merge does not change hosted site content.
    # Keep the next material main push as the single deployment trigger.
    paths-ignore:
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Avoid spending runner minutes on unapproved Draft intake proposals.
    # Non-draft PRs retain release-validation coverage; main pushes still deploy.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Configure custom domain environment
        shell: bash
        run: |
          echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://research.slackquant.com" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Canonical release validation
        run: npm run validate:release

      - name: Offline four-system publication audit regression
        run: python3 scripts/check-four-system-live-release.py --self-test

      - name: Disable Jekyll processing
        if: github.event_name != 'pull_request'
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check four-system public URLs after deploy (read-only)
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          base=https://research.slackquant.com
          bad=0
          for path in \
            /systems/adaa/ /systems/adaa/dashboard/ /assets/systems/adaa/snapshot.js \
            /systems/f2r/ /systems/f2r/dashboard/ /data/systems/f2r/public_state.json \
            /systems/pds/ /systems/pds/dashboard/ /data/systems/pds/public_system_identity.json \
            /systems/equity-alpha/ /dashboards/equity-alpha/ /dashboards/equity-alpha/data/live_overlay.js; do
            if curl --silent --show-error --location --head --fail \
              --connect-timeout 4 --max-time 8 --retry 1 --retry-delay 2 \
              "$base$path" >/dev/null; then
              printf 'HTTP_PASS %s\n' "$path"
            else
              printf '::warning::HTTP_HOLD %s (CDN propagation or missing file)\n' "$path"
              bad=1
            fi
          done
          echo "POSTDEPLOY_FOUR_SYSTEM_HTTP_SMOKE_DONE status=$bad scope=reachability_not_data_or_visual_parity"
          exit "$bad"
      - name: Checkout verified Pages release for data-byte parity
        uses: actions/checkout@v6
      - name: Verify live 4-system data bytes and source evidence (read-only)
        run: python3 scripts/check-four-system-live-release.py --root . --source-sha "${GITHUB_SHA}"

